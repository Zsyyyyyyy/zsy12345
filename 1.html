<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>货币转换器 - TWD / CNY / USD / THB</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --input-bg: #0f172a;
            --input-border: #475569;
            --success: #10b981;
            --rate-bg: #0f172a;
            --rate-border: #334155;
            --icon-twd: #f59e0b;
            --icon-cny: #ef4444;
            --icon-usd: #3b82f6;
            --icon-thb: #22c55e;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
            --divider: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(245, 158, 11, 0.06) 0%, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: var(--shadow);
        }

        .header { text-align: center; margin-bottom: 32px; }
        .header h1 {
            font-size: 26px; font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 6px;
        }
        .header .subtitle { font-size: 13px; color: var(--text-secondary); letter-spacing: 1px; }

        .input-section { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }

        .currency-row {
            display: flex; align-items: center; gap: 12px;
            background: var(--input-bg); border: 2px solid var(--input-border);
            border-radius: 14px; padding: 8px 10px 8px 18px;
            transition: all 0.25s ease;
        }
        .currency-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .currency-row.result { border-color: var(--success); background: rgba(16,185,129,0.04); }

        .currency-icon {
            width: 46px; height: 46px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 700; flex-shrink: 0;
        }
        .icon-twd { background: rgba(245,158,11,0.15); color: var(--icon-twd); }
        .icon-cny { background: rgba(239,68,68,0.15); color: var(--icon-cny); }
        .icon-usd { background: rgba(59,130,246,0.15); color: var(--icon-usd); }
        .icon-thb { background: rgba(34,197,94,0.15); color: var(--icon-thb); }

        .currency-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .currency-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        .currency-name { font-size: 14px; font-weight: 600; }

        .currency-input-wrap { flex: 1; display: flex; align-items: center; justify-content: flex-end; }
        .currency-input-wrap input {
            width: 100%; max-width: 220px; background: transparent; border: none;
            color: var(--text); font-size: 26px; font-weight: 600;
            text-align: right; padding: 8px 4px; outline: none;
            font-family: "SF Mono","JetBrains Mono","Menlo",monospace;
        }
        .currency-input-wrap input::placeholder { color: var(--text-secondary); opacity: 0.35; }
        .currency-input-wrap input::-webkit-outer-spin-button,
        .currency-input-wrap input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .currency-input-wrap input[type=number] { -moz-appearance: textfield; }

        .btn { width: 100%; padding: 14px 24px; border-radius: 12px; font-size: 15px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; font-family: inherit; margin-bottom: 12px; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,0.3); }
        .btn-primary:active { transform: translateY(0); }
        .btn-secondary { background: transparent; color: var(--text-secondary); border: 2px solid var(--input-border); }
        .btn-secondary:hover { border-color: var(--text-secondary); color: var(--text); }

        .result-banner { display: none; background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.25); border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; text-align: center; }
        .result-banner.show { display: block; }
        .result-banner .result-title { font-size: 12px; color: var(--success); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; font-weight: 500; }
        .result-banner .result-source { font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; }
        .result-banner .result-targets { display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; }
        .result-target { display: flex; flex-direction: column; align-items: center; }
        .result-target .target-currency { font-size: 11px; color: var(--text-secondary); margin-bottom: 2px; }
        .result-target .target-value { font-size: 22px; font-weight: 700; font-family: "SF Mono","JetBrains Mono","Menlo",monospace; color: var(--text); }

        .rates-section { background: var(--rate-bg); border: 1px solid var(--rate-border); border-radius: 14px; padding: 20px 24px; margin-bottom: 16px; }
        .rates-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .rates-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
        .live-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .update-time { font-size: 11px; color: var(--text-secondary); }
        .rate-grid { display: flex; flex-direction: column; gap: 2px; }
        .rate-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(51,65,85,0.5); }
        .rate-item:last-child { border-bottom: none; padding-bottom: 0; }
        .rate-pair { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
        .rate-pair .flag { font-size: 20px; }
        .rate-arrow { color: var(--text-secondary); font-size: 12px; }
        .rate-value { font-size: 18px; font-weight: 700; font-family: "SF Mono","JetBrains Mono","Menlo",monospace; color: var(--text); }

        .loading { display: none; text-align: center; padding: 16px 0; color: var(--text-secondary); font-size: 13px; margin-bottom: 16px; }
        .loading.show { display: block; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--input-border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px; vertical-align: -3px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg { display: none; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; padding: 12px 16px; border-radius: 10px; font-size: 13px; text-align: center; margin-bottom: 16px; }
        .error-msg.show { display: block; }

        .footer { text-align: center; font-size: 11px; color: var(--text-secondary); opacity: 0.6; }

        @media (max-width: 520px) {
            .container { padding: 24px 18px; border-radius: 16px; }
            .currency-row { padding: 6px 8px 6px 14px; gap: 10px; }
            .currency-icon { width: 40px; height: 40px; border-radius: 10px; font-size: 16px; }
            .currency-input-wrap input { font-size: 22px; max-width: 150px; }
            .currency-name { font-size: 12px; }
            .result-target .target-value { font-size: 18px; }
            .result-banner .result-targets { gap: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💱 货币转换器</h1>
            <div class="subtitle">TWD · CNY · USD · THB</div>
        </div>

        <div class="error-msg" id="errorMsg"></div>
        <div class="loading" id="loading"><span class="spinner"></span>正在获取实时汇率...</div>

        <div class="result-banner" id="resultBanner">
            <div class="result-title">✅ 转换结果</div>
            <div class="result-source" id="resultSource"></div>
            <div class="result-targets" id="resultTargets"></div>
        </div>

        <div class="input-section">
            <div class="currency-row" id="rowTWD">
                <div class="currency-icon icon-twd">NT$</div>
                <div class="currency-info"><div class="currency-label">TWD</div><div class="currency-name">新台币</div></div>
                <div class="currency-input-wrap"><input type="number" id="inputTWD" placeholder="0.00" step="any" min="0"></div>
            </div>
            <div class="currency-row" id="rowCNY">
                <div class="currency-icon icon-cny">¥</div>
                <div class="currency-info"><div class="currency-label">CNY</div><div class="currency-name">人民币</div></div>
                <div class="currency-input-wrap"><input type="number" id="inputCNY" placeholder="0.00" step="any" min="0"></div>
            </div>
            <div class="currency-row" id="rowUSD">
                <div class="currency-icon icon-usd">$</div>
                <div class="currency-info"><div class="currency-label">USD</div><div class="currency-name">美元</div></div>
                <div class="currency-input-wrap"><input type="number" id="inputUSD" placeholder="0.00" step="any" min="0"></div>
            </div>
            <div class="currency-row" id="rowTHB">
                <div class="currency-icon icon-thb">฿</div>
                <div class="currency-info"><div class="currency-label">THB</div><div class="currency-name">泰铢</div></div>
                <div class="currency-input-wrap"><input type="number" id="inputTHB" placeholder="0.00" step="any" min="0"></div>
            </div>
        </div>

        <button class="btn btn-primary" id="btnConvert">🔍 查询转换</button>
        <button class="btn btn-secondary" id="btnClear">✕ 清空</button>

        <div class="rates-section">
            <div class="rates-header">
                <div class="rates-title"><span class="live-dot"></span>实时汇率</div>
                <div class="update-time" id="updateTime">--</div>
            </div>
            <div class="rate-grid">
                <div class="rate-item">
                    <div class="rate-pair">美元USD <span class="rate-arrow">→</span> 人民币CNY</div>
                    <div class="rate-value" id="rateUSDCNY">--</div>
                </div>
                
                <div class="rate-item">
                    <div class="rate-pair">美元USD <span class="rate-arrow">→</span> 新台币TWD</div>
                    <div class="rate-value" id="rateUSDTWD">--</div>
                </div>
                
                <div class="rate-item">
                    <div class="rate-pair">人民币CNY <span class="rate-arrow">→</span> 新台币TWD</div>
                    <div class="rate-value" id="rateCNYTWD">--</div>
                </div>
                <div class="rate-item">
                    <div class="rate-pair">美元USD <span class="rate-arrow">→</span> 泰铢THB</div>
                    <div class="rate-value" id="rateUSDTHB">--</div>
                </div>
                <div class="rate-item">
                    <div class="rate-pair">人民币CNY <span class="rate-arrow">→</span> 泰铢THB</div>
                    <div class="rate-value" id="rateCNYTHB">--</div>
                </div>
                <div class="rate-item">
                    <div class="rate-pair">新台币TWD <span class="rate-arrow">→</span> 泰铢THB</div>
                    <div class="rate-value" id="rateTWDTHB">--</div>
                </div>
            </div>
        </div>

        <div class="footer">数据来源: open.er-api.com · 汇率仅供参考</div>
    </div>

<script>
(function() {
    var rates = { USD: 1, CNY: null, TWD: null, THB: null };

    var $ = function(id) { return document.getElementById(id); };
    var inputTWD = $('inputTWD'), inputCNY = $('inputCNY'), inputUSD = $('inputUSD'), inputTHB = $('inputTHB');
    var rowTWD = $('rowTWD'), rowCNY = $('rowCNY'), rowUSD = $('rowUSD'), rowTHB = $('rowTHB');
    var btnConvert = $('btnConvert'), btnClear = $('btnClear');
    var errorMsg = $('errorMsg'), loading = $('loading'), updateTime = $('updateTime');
    var resultBanner = $('resultBanner'), resultSource = $('resultSource'), resultTargets = $('resultTargets');

    var curNames = { TWD:'新台币', CNY:'人民币', USD:'美元', THB:'泰铢' };
    var curSymbols = { TWD:'NT$ ', CNY:'¥ ', USD:'$ ', THB:'฿ ' };

    function showError(msg) {
        errorMsg.textContent = msg; errorMsg.classList.add('show');
        setTimeout(function(){ errorMsg.classList.remove('show'); }, 5000);
    }

    function fmt(n, d) { return (n==null||isNaN(n)) ? '--' : Number(n).toFixed(d||2); }
    function fmtMoney(n, c) {
        if (n==null||isNaN(n)) return '--';
        return (curSymbols[c]||'') + Number(n).toFixed(c==='TWD'?0:2);
    }

    function updateRateDisplay() {
        $('rateUSDCNY').textContent = fmt(rates.CNY, 2);
        $('rateUSDTWD').textContent = fmt(rates.TWD, 2);
        $('rateCNYTWD').textContent = fmt(rates.TWD/rates.CNY, 2);
        $('rateUSDTHB').textContent = fmt(rates.THB, 2);
        $('rateCNYTHB').textContent = fmt(rates.THB/rates.CNY, 2);
        $('rateTWDTHB').textContent = fmt(rates.THB/rates.TWD, 2);
    }

    async function fetchRates() {
        loading.classList.add('show'); errorMsg.classList.remove('show');
        try {
            var resp = await fetch('https://open.er-api.com/v6/latest/USD', { signal: AbortSignal.timeout(10000) });
            if (!resp.ok) throw new Error('HTTP '+resp.status);
            var data = await resp.json();
            if (data.result !== 'success') throw new Error('API error');
            rates.CNY = data.rates.CNY; rates.TWD = data.rates.TWD; rates.THB = data.rates.THB;
            if (!rates.CNY || !rates.TWD || !rates.THB) throw new Error('Missing data');
            var now = new Date();
            updateTime.textContent = '更新于 '+now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
            updateRateDisplay();
            loading.classList.remove('show');
            return true;
        } catch(e) {
            loading.classList.remove('show');
            console.error('Fetch rates failed:', e);
            rates.CNY = 7.25; rates.TWD = 32.5; rates.THB = 34.5;
            updateTime.textContent = '离线估算';
            updateRateDisplay();
            $('rateUSDCNY').textContent += ' (估)';
            $('rateUSDTWD').textContent += ' (估)';
            $('rateCNYTWD').textContent += ' (估)';
            $('rateUSDTHB').textContent += ' (估)';
            $('rateCNYTHB').textContent += ' (估)';
            $('rateTWDTHB').textContent += ' (估)';
            showError('⚠️ 实时汇率获取失败，使用估算汇率。请检查网络后刷新。');
            return false;
        }
    }

    function convert() {
        var vTWD = parseFloat(inputTWD.value), vCNY = parseFloat(inputCNY.value), vUSD = parseFloat(inputUSD.value), vTHB = parseFloat(inputTHB.value);
        var hTWD = !!inputTWD.value && !isNaN(vTWD) && vTWD > 0;
        var hCNY = !!inputCNY.value && !isNaN(vCNY) && vCNY > 0;
        var hUSD = !!inputUSD.value && !isNaN(vUSD) && vUSD > 0;
        var hTHB = !!inputTHB.value && !isNaN(vTHB) && vTHB > 0;
        var cnt = (hTWD?1:0)+(hCNY?1:0)+(hUSD?1:0)+(hTHB?1:0);

        if (cnt === 0) { showError('请至少输入一个金额'); return; }
        if (cnt > 1) { showError('请只在一种货币中输入金额'); return; }
        if (!rates.CNY || !rates.TWD || !rates.THB) { showError('汇率数据尚未加载，请刷新页面重试'); return; }

        var srcCur, srcVal, results = [];

        if (hTWD) { srcCur='TWD'; srcVal=vTWD; }
        else if (hCNY) { srcCur='CNY'; srcVal=vCNY; }
        else if (hUSD) { srcCur='USD'; srcVal=vUSD; }
        else { srcCur='THB'; srcVal=vTHB; }

        // Convert source to USD first
        var usdVal;
        if (srcCur === 'USD') usdVal = srcVal;
        else if (srcCur === 'CNY') usdVal = srcVal / rates.CNY;
        else if (srcCur === 'TWD') usdVal = srcVal / rates.TWD;
        else usdVal = srcVal / rates.THB;

        // Convert USD to targets
        var all = { TWD: usdVal * rates.TWD, CNY: usdVal * rates.CNY, USD: usdVal, THB: usdVal * rates.THB };

        // Build results excluding source
        var targets = ['TWD','CNY','USD','THB'].filter(function(c){ return c !== srcCur; });
        var html = '';
        targets.forEach(function(c) {
            html += '<div class="result-target"><div class="target-currency">'+curNames[c]+' ('+c+')</div><div class="target-value">'+fmtMoney(all[c], c)+'</div></div>';
        });

        resultSource.textContent = fmtMoney(srcVal, srcCur) + ' ' + curNames[srcCur];
        resultTargets.innerHTML = html;
        resultBanner.classList.add('show');

        // Highlight filled rows
        [rowTWD,rowCNY,rowUSD,rowTHB].forEach(function(r){ r.classList.remove('result'); });
        targets.forEach(function(c) {
            var row = c==='TWD'?rowTWD:(c==='CNY'?rowCNY:(c==='USD'?rowUSD:rowTHB));
            row.classList.add('result');
            var inp = c==='TWD'?inputTWD:(c==='CNY'?inputCNY:(c==='USD'?inputUSD:inputTHB));
            inp.value = all[c].toFixed(c==='TWD'?0:2);
        });
    }

    function clearAll() {
        inputTWD.value = ''; inputCNY.value = ''; inputUSD.value = ''; inputTHB.value = '';
        rowTWD.classList.remove('result'); rowCNY.classList.remove('result'); rowUSD.classList.remove('result'); rowTHB.classList.remove('result');
        resultBanner.classList.remove('show');
    }

    // Enter key triggers convert
    [inputTWD, inputCNY, inputUSD, inputTHB].forEach(function(inp) {
        inp.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); convert(); }
        });
    });

    btnConvert.addEventListener('click', convert);
    btnClear.addEventListener('click', clearAll);

    // Fetch rates on load
    fetchRates();
})();
</script>
</body>
</html>
