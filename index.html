<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZSY12345 · 工具箱</title>
    <style>
        *, *::before, *::after { font-family: "Maple Mono","Maple Mono CN","霞鹜文楷等宽","LXGW WenKai Mono",monospace !important; }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: #000;
            padding: 28px 16px 40px;
        }

        .terminal {
            width: 920px;
            max-width: 100%;
            background: #0d0d0d;
            border-radius: 10px;
            border: 1px solid #262626;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
        }

        .titlebar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 16px;
            background: #151515;
            border-bottom: 1px solid #262626;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }
        .title { margin-left: 12px; font-size: 15px; color: #666; }

        .prompt-line {
            padding: 16px 20px 4px;
            font-size: 15px;
            color: #8b949e;
        }
        .prompt-line .user { color: #7ee787; }
        .prompt-line .host { color: #79c0ff; }
        .prompt-line .path { color: #d2a8ff; }
        .prompt-line .p { color: #f0f6fc; }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            padding: 18px 20px 22px;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 16px 8px 14px;
            background: #111;
            border: 1px solid #222;
            border-radius: 10px;
            text-decoration: none;
            color: #c9d1d9;
            min-height: 96px;
            transition: all 0.18s ease;
        }
        .card:hover {
            background: #1a1a1a;
            border-color: #444;
            transform: translateY(-3px);
        }
        .card .num {
            font-size: 11px;
            color: #58a6ff;
            letter-spacing: 0.5px;
        }
        .card .icon {
            font-size: 24px;
            line-height: 1;
            opacity: 0.85;
        }
        .card .name {
            font-size: 13px;
            text-align: center;
            white-space: nowrap;
        }
        .card .ext-tag {
            position: absolute;
            font-size: 9px;
            color: #d2a8ff;
        }

        .card.ext  .num { color: #d2a8ff; }
        .card.game .num { color: #ff7b72; }
        .card.fun  .num { color: #ffa657; }
        .card.note .num { color: #3fb950; }
        .card.tool .num { color: #58a6ff; }

        .card.placeholder {
            background: #0c0c0c;
            border: 1px dashed #1f1f1f;
            cursor: default;
        }
        .card.placeholder:hover { transform: none; background: #0c0c0c; border-color: #1f1f1f; }
        .card.placeholder .icon { opacity: 0.28; }
        .card.placeholder .name { color: #4d4d4d; white-space: normal; font-size: 12px; }

        .footer {
            padding: 0 20px 18px;
            font-size: 13px;
            color: #484f58;
        }

        @media (max-width: 760px) {
            .grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 420px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
