<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZSY12345</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .card {
            width: 380px;
            padding: 40px;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        p {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn {
            display: block;
            margin: 15px auto;
            width: 220px;
            padding: 14px;
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg,#4facfe,#00f2fe);
            border-radius: 30px;
            font-size: 18px;
            transition: all .3s;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,.2);
        }

    </style>
</head>


<body>

<div class="card">

    <h1>ZSY12345</h1>

    <p>请选择服务</p>

    <a class="btn" href="/1.html">
        页面 1
    </a>

    <a class="btn" href="/2.html">
        页面 2
    </a>

</div>


</body>
</html>
