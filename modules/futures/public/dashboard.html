<style>

    --mono: "Maple Mono","Maple Mono CN","霞鹜文楷等宽","LXGW WenKai Mono",monospace;
  }

    --muted: #8b949e;
    --accent: #8b949e;
    --up: #8b949e;
    --down: #8b949e;
    --flat: #8b949e;
  }

  body {

    padding: 28px 16px 40px; line-height: 1.4;
  }
  /* 终端外壳（仿首页 index.html） */
  .terminal {

    border-radius: 10px; border: 1px solid #262626;

  /* 终端标题栏（仿首页 index.html，融合进 terminal 顶部） */
  .titlebar {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px; background: #151515;
    border-bottom: 1px solid #262626;
  }
  .tdot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .tdot.red { background: #ff5f56; }
  .tdot.yellow { background: #ffbd2e; }
  .tdot.green { background: #27c93f; }
  .titlebar .title { margin-left: 4px; font-size: 14px; color: #666; }
  .titlebar .nav { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .titlebar .nav-group { display: flex; gap: 8px; align-items: center; }
  .titlebar .nav-group.hidden { display: none; }
  .titlebar .nav-btn {
    padding: 4px 12px; border-radius: 6px; font-size: 12px;
    text-decoration: none; cursor: pointer;
    background: transparent; color: var(--text); border: 1px solid var(--border);
  }
  .titlebar .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .titlebar .nav-btn.solid { color: #fff; background: #238636; border-color: #2ea043; }
  .titlebar .nav-btn.solid:hover { background: #2ea043; color: #fff; }
  .titlebar .username { font-size: 12px; color: #79c0ff; }
  header { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  header h1 { font-size: 16px; font-weight: 500; color: var(--accent); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--up); display: inline-block; }
  .dot.off { background: var(--muted); }
  .spacer { flex: 1; }
  .status { color: var(--muted); font-size: 12px; }
  select, button, input {
    font-family: var(--mono); font-size: 12px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 10px; outline: none;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  input { width: 200px; }
  input::placeholder { color: var(--muted); }
  .add-row { position: relative; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 11px; }
  .suggest {
    position: absolute; top: 34px; left: 0; width: 320px; max-height: 320px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; z-index: 10;
    display: none;
  }
  .suggest.show { display: block; }
  .suggest .item {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px; cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .suggest .item:hover { background: var(--line); }
  .suggest .item .nm { color: var(--text); }
  .suggest .item .cd { color: var(--muted); font-size: 11px; }
  .suggest .item .mk { margin-left: auto; font-size: 10px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); }
  .layout { display: flex; gap: 16px; align-items: flex-start; }
  .layout > main { flex: 1 1 0; min-width: 0; }
  .layout > aside { flex: 1 1 0; min-width: 0; }
  section { margin-bottom: 12px; }
  section h2 { font-size: 12px; font-weight: 500; color: var(--accent); margin-bottom: 5px; padding-bottom: 3px; border-bottom: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: right; padding: 2px 8px; white-space: nowrap; }
  th { color: var(--muted); font-weight: 400; font-size: 11px; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  td { border-bottom: 1px solid var(--line); }
  tr:hover td { background: var(--line); }
  /* 看盘行情表：每个分组表用同一套固定列宽（table-layout:fixed），
     让「股票/指数/商品期货」各表的表头与数据竖着对齐；
     # 居中；名称(2)/代码(3) 表头与内容一起左对齐；其余数字列右对齐 */
  .quote-table { table-layout: fixed; }
  .quote-table thead th:nth-child(1) { width: 36px; }
  .quote-table thead th:nth-child(2) { width: 22%; }
  .quote-table thead th:nth-child(3) { width: 15%; }
  .quote-table thead th:last-child { width: 7%; }
  .quote-table th:nth-child(2), .quote-table td:nth-child(2),
  .quote-table th:nth-child(3), .quote-table td:nth-child(3) { text-align: left; }
  .quote-table th, .quote-table td { overflow: hidden; text-overflow: ellipsis; }
  .quote-table th:last-child, .quote-table td:last-child { overflow: visible; }
  /* 序号列：固定 36px 足够显示两位序号且不截断 */
  .quote-table th:nth-child(1), .quote-table td:nth-child(1) { padding-left: 4px; padding-right: 4px; overflow: visible; }
  /* 名称列表头与内容一起右移一点，和序号列留出间隔 */
  .quote-table th:nth-child(2), .quote-table td:nth-child(2) { padding-left: 14px; }
  /* 持仓表：名称列(2) 表头跟随内容左对齐 */
  .pos-table th:nth-child(2), .pos-table td:nth-child(2) { text-align: left; }
  .name { color: var(--text); cursor: pointer; text-align: left; }
  .name:hover { color: var(--accent); }
  td.num, th.num { text-align: center; }
  .code { color: var(--muted); font-size: 11px; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--flat); }
  .op { visibility: hidden; color: var(--muted); background: none; border: none; padding: 0 4px; font-size: 13px; cursor: pointer; }
  tr:hover .op { visibility: visible; }
  .op:hover { color: var(--accent); }
  .op.del:hover { color: var(--up); }
  .op.settle:hover { color: var(--down); }
  /* 持仓品种标记：看盘清单里标出「我的」中持有的品种 */
  tr.has-pos td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
  .pos-tag {
    display: inline-block; margin-left: 5px; padding: 0 4px;
    font-size: 10px; line-height: 13px; vertical-align: 1px;
    border: 1px solid var(--accent); color: var(--accent); border-radius: 3px;
  }
  /* 结算弹窗 */
  .settle-info { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 8px; }
  .settle-info b { color: var(--text); font-weight: 500; }
  .settle-form { display: flex; flex-direction: column; gap: 10px; }
  .settle-form label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .settle-form label span { width: 84px; text-align: right; flex-shrink: 0; }
  .settle-form input { flex: 1; width: auto; }
  .settle-form .row-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .settle-form .row-btns .primary { color: var(--down); border-color: var(--down); }
  .settle-form .msg { color: var(--up); font-size: 11px; min-height: 14px; }
  /* 添加确认弹窗：确认按钮用 accent 色，与结算的绿色区分 */
  #addConfirm.primary { color: var(--accent); border-color: var(--accent); }
  #addConfirm.primary:disabled { color: var(--muted); border-color: var(--border); cursor: not-allowed; }
  .add-info .loading { color: var(--muted); }
  /* 结算历史列表 */
  .settle-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .settle-table th { color: var(--muted); text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--border); }
  .settle-table td { padding: 3px 6px; border-bottom: 1px solid var(--line); }
  footer { color: var(--muted); font-size: 11px; margin-top: 8px; }
  .pos-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 3px; border-bottom: 1px solid var(--border); margin-bottom: 5px; }
  .pos-head h2 { border-bottom: none; margin: 0; padding: 0; }
  .sort-btn { font-size: 11px; padding: 2px 8px; }
  .pos-total { margin-top: 8px; font-size: 12px; }
  .lock-box { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .lock-box input { width: 130px; }
  .lock-msg { color: var(--up); font-size: 11px; width: 100%; }
  /* 持仓编辑弹窗表单 */
  .modal.narrow { width: 360px; }
  .pos-form { display: flex; flex-direction: column; gap: 10px; }
  .pos-form label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .pos-form label span { width: 84px; text-align: right; flex-shrink: 0; }
  .pos-form input, .pos-form select { flex: 1; width: auto; }
  .pos-code-row { position: relative; }
  .pos-code-row label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .pos-code-row label span { width: 84px; text-align: right; flex-shrink: 0; }
  .pos-code-row input { flex: 1; width: auto; }
  .pos-suggest { top: 30px; left: 92px; right: 0; width: auto; max-height: 240px; }
  .pos-form .row-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .pos-form .row-btns .primary { color: var(--accent); border-color: var(--accent); }
  .pos-form .msg { color: var(--up); font-size: 11px; min-height: 14px; }
  .op.edit:hover { color: var(--accent); }
  /* 走势图弹窗 */
  .mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
  .mask.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; width: 760px; max-width: 95vw; }
  .modal-head { display: flex; align-items: center; margin-bottom: 8px; }
  .modal-head .t { font-size: 14px; font-weight: 500; color: var(--accent); }
  .modal-head .sub { margin-left: 10px; color: var(--muted); font-size: 12px; }

  .modal-head .tab-btn { border: 1px solid var(--border); background: none; color: var(--muted); font-size: 12px; border-radius: 4px; padding: 2px 10px; margin-left: 6px; cursor: pointer; }
  .modal-head .tab-btn.active { color: var(--accent); border-color: var(--accent); }
  .modal-head .tab-btn:hover { color: var(--accent); }
  .modal-head .close-btn { border: none; background: none; color: var(--muted); font-size: 18px; cursor: pointer; }
  .modal-head .close-btn:hover { color: var(--up); }
  canvas { width: 100%; height: auto; display: block; }
  /* 黑白主题切换按钮（左下角固定） */
  #themeToggle {
    position: fixed; left: 14px; bottom: 14px; z-index: 200;

  #themeToggle .ico { font-size: 14px; line-height: 1; }
</style>

        <div class="msg" id="addMsg"></div>
      </div>
    </div>
  </div>

  <div class="mask" id="historyMask">
    <div class="modal">
      <div class="modal-head">
        <span class="t">结算记录</span>
        <span class="sub" id="historySub"></span>
        <span class="sp"></span>
        <button class="close-btn" id="historyClose">×</button>
      </div>
      <div id="historyBody" style="max-height:60vh;overflow:auto;"></div>
    </div>
  </div>

  <button id="themeToggle" title="一键切换彩色/灰度（黑白）显示"><span class="ico" id="themeIco">●</span><span id="themeLabel">灰</span></button>

<script>
(function () {
  'use strict';

  const DEFAULT_GROUPS = [
    { name: '股票', codes: ['sh600519', 'sh600036', 'sh601318'] },
    { name: '指数', codes: ['sh000905', 'sh000688', 'bj899050', 'sh000001', 'sz399001'] },
    { name: '国内商品期货', codes: ['nf_RB0', 'nf_CU0', 'nf_AU0', 'nf_AG0', 'nf_I0', 'nf_M0', 'nf_MA0', 'nf_SC0', 'nf_TA0', 'nf_P0'] },
  ];

  const CONFIG_POLL_MS = 3000; // 配置文件轮询间隔（毫秒）
  const banner = document.getElementById('banner');
  const dot = document.getElementById('dot');
  const updateTime = document.getElementById('updateTime');
  const main = document.getElementById('main');
  const intervalSel = document.getElementById('interval');
  const refreshBtn = document.getElementById('refreshBtn');
  const searchInput = document.getElementById('searchInput');
  const addBtn = document.getElementById('addBtn');
  const suggestBox = document.getElementById('suggestBox');
  const chartMask = document.getElementById('chartMask');
  const chartCanvas = document.getElementById('chartCanvas');
  const chartTitle = document.getElementById('chartTitle');
  const chartSub = document.getElementById('chartSub');
  const chartClose = document.getElementById('chartClose');
  const posMask = document.getElementById('posMask');
  const posTitle = document.getElementById('posTitle');
  const posCode = document.getElementById('posCode');
  const posDir = document.getElementById('posDir');
  const posBuyLabel = document.getElementById('posBuyLabel');
  const posBuy = document.getElementById('posBuy');
  const posLots = document.getElementById('posLots');
  const posMult = document.getElementById('posMult');
  const posSave = document.getElementById('posSave');
  const posCancel = document.getElementById('posCancel');
  const posClose = document.getElementById('posClose');
  const posMsg = document.getElementById('posMsg');
  const settleMask = document.getElementById('settleMask');
  const settleTitle = document.getElementById('settleTitle');
  const settleInfo = document.getElementById('settleInfo');
  const settlePrice = document.getElementById('settlePrice');
  const settleSave = document.getElementById('settleSave');
  const settleCancel = document.getElementById('settleCancel');
  const settleClose = document.getElementById('settleClose');
  const settleMsg = document.getElementById('settleMsg');
  const historyMask = document.getElementById('historyMask');
  const historySub = document.getElementById('historySub');
  const historyBody = document.getElementById('historyBody');
  const historyClose = document.getElementById('historyClose');
  const addMask = document.getElementById('addMask');
  const addInfo = document.getElementById('addInfo');
  const addGroupSel = document.getElementById('addGroupSel');
  const addCancel = document.getElementById('addCancel');
  const addConfirm = document.getElementById('addConfirm');
  const addClose = document.getElementById('addClose');
  const addMsg = document.getElementById('addMsg');

  // ===== 一键灰度（黑白）切换 =====
  const THEME_KEY = 'leek-futures-gray';
  const themeToggle = document.getElementById('themeToggle');
  const themeIco = document.getElementById('themeIco');
  const themeLabel = document.getElementById('themeLabel');
  let gray = false;
  try { gray = localStorage.getItem(THEME_KEY) === '1'; } catch (e) { /* ignore */ }
  function applyGray(g) {
    gray = g;
    document.documentElement.classList.toggle('gray', g);
    // 按钮显示「点击后要切到的目标」：彩色态显示●灰（点一下变灰），灰度态显示○彩（点一下恢复彩色）
    if (g) { themeIco.textContent = '○'; themeLabel.textContent = '彩'; }
    else { themeIco.textContent = '●'; themeLabel.textContent = '灰'; }
  }
  themeToggle.addEventListener('click', () => {
    applyGray(!gray);
    try { localStorage.setItem(THEME_KEY, gray ? '1' : '0'); } catch (e) { /* ignore */ }
  });
  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  applyGray(gray);

  let timer = null;
  let lastDataMap = {};
  let configGroups = null; // 服务端看盘分组（null = 尚未加载，先用默认）
  let configPositions = []; // 持仓（来自数据库 /api/positions）
  let configSig = '';      // 配置签名，用于检测变化

  function allGroups() {
    // 渲染用：过滤掉空分组（configGroups 保留完整信息供添加/删除时按 name 查找）
    const base = configGroups && configGroups.length ? configGroups : DEFAULT_GROUPS;
    return base.filter((g) => g.codes && g.codes.length > 0);
  }
  // 按品种代码类型归类到对应的看盘分组名（仅剩 A股 + 国内期货）
  function groupNameFor(code) {
    const c = String(code || '');
    if (/^nf_/.test(c)) return '国内商品期货';
    // A股指数：上证 sh000 / 深证 sz399 / 北证 bj899
    if (/^sh000/.test(c) || /^sz399/.test(c) || /^bj899/.test(c)) return '指数';
    return '股票';
  }

  // 沪市指数代码（纯 6 位数字、000 开头）：这些是上证/中证系列指数，需加 sh 前缀，
  // 不能按首位 0 判成深市股票。如 000300 沪深300、000905 中证500、000688 科创50 等。
  const SH_INDEX_TAIL = /^000(300|905|852|688|016|010)$/;
  function normalizeCode(raw) {
    let s = String(raw || '').trim().toUpperCase();
    if (!s) return '';
    if (/^NF_/.test(s)) return s.replace(/^NF_/, 'nf_');
    // 股票 / 指数：带 sh/sz/bj 前缀（如 sh600519 / bj899050），必须是 6 位数字。
    // 注意不能只匹配 \d：SH 同时是烧碱期货品种代码，SH2701（4 位）应归期货而非上交所。
    if (/^(SH|SZ|BJ)\d{6}$/.test(s)) return s.toLowerCase();
    // 纯 6 位数字：先判沪市指数（000 开头的指数代码加 sh 前缀），再按首位判断交易所：6→沪、0/3→深、4/8→北
    if (/^\d{6}$/.test(s)) {
      if (SH_INDEX_TAIL.test(s)) return 'sh' + s;
      if (/^[56]/.test(s)) return 'sh' + s;
      if (/^[03]/.test(s)) return 'sz' + s;
      return 'bj' + s;
    }
    // 国内期货：字母 + 数字（RB0 / RB2701 / IF0），如 RB2701、SH2701
    if (/^[A-Z]+\d/.test(s)) return 'nf_' + s;
    // 其余（海外期货字母 OIL/GC、港股 hkXXX 等已下线）→ 无效代码
    return '';
  }
  // 持仓专用代码规范化：仅接受国内期货（nf_ 前缀或 字母+3~4位数字 的完整合约），
  // 其余（股票/港股/海外期货/纯字母品种名）一律返回空串，提示重新填写。
  function normalizePosCode(raw) {
    let s = String(raw || '').trim().toUpperCase();
    if (!s) return '';
    if (/^NF_/.test(s)) return s.replace(/^NF_/, 'nf_');
    // 国内期货完整合约：字母 + 3~4 位数字（RB2701）
    if (/^[A-Z]{1,4}\d{3,4}$/.test(s)) return 'nf_' + s;
    // 纯字母（如 RB）是品种名缺月份；其余是股票/港股/海外期货 → 都无效
    return '';
  }
  // groupName 省略时按代码类型自动归类；返回是否添加成功
  async function addCode(code, groupName) {
    code = normalizeCode(code);
    if (!code || groupCodes().includes(code)) return false;
    const name = groupName || groupNameFor(code);
    const g = configGroups && configGroups.find((x) => x.name === name);
    try {
      let resp;
      if (g && g.id) {
        // 已有该分组：往里面追加代码
        const codes = (g.codes || []).concat(code);
        resp = await fetch('/api/groups/' + g.id, {
          method: 'PUT',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ codes }),
        });
      } else {
        // 没有该分组：新建并归类
        resp = await fetch('/api/groups', {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ name, codes: [code], sort_order: configGroups ? configGroups.length : 0 }),
        });
      }
      if (resp.status === 401) { toLogin(); return false; }
      if (!resp.ok) { alert('添加失败 HTTP ' + resp.status); return false; }
      loadConfig(true);
      return true;
    } catch (e) {
      alert('添加失败：' + e.message);
      return false;
    }
  }

  // ===== 添加品种：先展示详情确认，再选择分组 =====
  let pendingCode = null;
  async function openAddForm(rawCode, fallbackName) {
    const code = normalizeCode(rawCode);
    if (!code) { alert('请输入有效的品种代码'); return; }
    pendingCode = code;
    addMsg.textContent = '';
    addConfirm.disabled = false;
    // 分组下拉框按代码类型预选，用户可在弹窗里自行改成任意分组
    addGroupSel.value = groupNameFor(code);
    if (groupCodes().includes(code)) {
      addMsg.textContent = '该品种已在看盘清单中';
      addConfirm.disabled = true;
    }
    addInfo.innerHTML = '代码：<b>' + fmtCode(code) + '</b>' + (fallbackName ? '（' + fallbackName + '）' : '') +
      '<br><span class="loading">获取行情…</span>';
    addMask.classList.add('show');

    // 优先复用已加载的行情，否则单独拉一次该品种的实时行情
    let d = lastDataMap[code];
    if (!d) {
      try {
        const resp = await fetch('/api/futures?codes=' + encodeURIComponent(code));
        const json = await resp.json();
        d = (json.items || []).find((x) => x.code === code);
      } catch (e) { /* 拉不到行情就只展示代码信息 */ }
    }
    renderAddInfo(code, d, fallbackName);
  }
  function renderAddInfo(code, d, fallbackName) {
    let html = '名称：<b>' + ((d && d.name) || fallbackName || '--') + '</b>（' + fmtCode(code) + '）<br>' +
      '类型：<b>' + groupNameFor(code) + '</b>';
    if (d && !isNaN(Number(d.price)) && Number(d.price) !== 0) {
      const price = Number(d.price), yest = Number(d.yestclose);
      const updown = yest && !isNaN(yest) ? price - yest : 0;
      const pct = yest && yest !== 0 ? (updown / yest) * 100 : 0;
      const cls = updown > 0 ? 'up' : updown < 0 ? 'down' : 'flat';
      const sign = updown > 0 ? '+' : '';
      html += '<br>现价：<b class="' + cls + '">' + fmtNum(price) + '</b>' +
        ' <span class="' + cls + '">' + sign + fmtNum(updown, 2) + '（' + sign + fmtNum(pct, 2) + '%）</span>';
      if (d.time) html += '<br>时间：' + fmtTime(d.time);
    } else {
      html += '<br>现价：<span class="flat">暂无行情数据</span>';
    }
    addInfo.innerHTML = html;
  }
  function closeAddForm() { addMask.classList.remove('show'); pendingCode = null; }
  async function confirmAdd() {
    if (!pendingCode) return;
    if (groupCodes().includes(pendingCode)) { addMsg.textContent = '该品种已在看盘清单中'; return; }
    const ok = await addCode(pendingCode, addGroupSel.value);
    if (ok) closeAddForm();
  }
  async function removeCode(code) {
    const g = configGroups && configGroups.find((x) => (x.codes || []).includes(code));
    if (!g || !g.id) return;
    const codes = g.codes.filter((c) => c !== code);
    try {
      const resp = await fetch('/api/groups/' + g.id, {
        method: 'PUT',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ codes }),
      });
      if (resp.status === 401) { toLogin(); return; }
      if (!resp.ok) { alert('删除失败 HTTP ' + resp.status); return; }
      loadConfig(true);
    } catch (e) {
      alert('删除失败：' + e.message);
    }
  }
  function allCodes() {
    // 拉行情用全集：看盘分组 ∪ 持仓（持仓行也要现价算盈亏）
    const base = allGroups().reduce((acc, g) => acc.concat(g.codes), []);
    const pos = (configPositions || []).map((p) => p.code).filter(Boolean);
    return Array.from(new Set(base.concat(pos)));
  }
  function groupCodes() {
    // 左侧「看盘清单」里的代码（判断是否已加分组只能用这个，持仓不算）
    return Array.from(new Set(allGroups().reduce((acc, g) => acc.concat(g.codes), [])));
  }

  // ===== 格式化 =====
  function fmtNum(v, d) {
    const n = Number(v);
    if (isNaN(n)) return '--';
    if (d === undefined) d = Math.abs(n) >= 1000 ? 1 : 2;
    return n.toFixed(d);
  }
  function fmtVol(v) {
    const n = Number(v);
    if (isNaN(n) || n === 0) return '--';
    if (n >= 1e8) return (n / 1e8).toFixed(2) + '亿';
    if (n >= 1e4) return (n / 1e4).toFixed(2) + '万';
    return String(n);
  }
  function fmtTime(t) {
    if (!t) return '--';
    const s = String(t);
    if (s.includes(':')) return s;
    if (/^\d{6}$/.test(s)) return s.slice(0, 2) + ':' + s.slice(2, 4) + ':' + s.slice(4, 6);
    return s;
  }
  // 展示用代码：隐藏 nf_ 前缀（RB2701 / RB0），内部仍用完整代码做行情/增删
  function fmtCode(code) {
    return String(code || '').replace(/^nf_/i, '');
  }

  // ===== 持仓标记 =====
  // 找出该代码在「我的」中的持仓（无持仓则 undefined）
  function posOf(code) {
    const c = normalizeCode(code);
    return (configPositions || []).find((p) => p.code === c);
  }
  // 持仓悬浮提示：持仓 2 手 @1030
  function posTip(pos) {
    if (!pos) return '';
    // 统一用 Number 转字符串，避免出现 1030.0 / 708.00 这类位数不齐的显示
    const lots = Number(pos.lots);
    const lotsTxt = Number.isInteger(lots) ? String(lots) : String(lots);
    return '持仓 ' + dirLabel(dirOf(pos)) + ' ' + lotsTxt + ' 手 @' + Number(pos.buyPrice);
  }
  // 名称单元格的标记与提示（持仓标签 + 分时图提示）
  function nameCell(d, code, pos) {
    const tag = pos ? '<span class="pos-tag">持</span>' : '';
    const tips = [];
    if (pos) tips.push(posTip(pos));
    if (d && code.startsWith('nf_')) tips.push('查看分时图');
    const title = tips.length ? ' title="' + tips.join(' · ') + '"' : '';
    return '<td class="name"' + title + '>' + (d ? d.name : '--') + tag + '</td>';
  }

  // ===== 渲染行情 =====
  function render(dataMap) {
    lastDataMap = dataMap;
    main.innerHTML = '';
    allGroups().forEach((g) => {
      const sec = document.createElement('section');
      const h = document.createElement('h2');
      h.textContent = g.name;
      sec.appendChild(h);
      const table = document.createElement('table');
      table.className = 'quote-table';
      table.innerHTML =
        '<thead><tr><th class="num">#</th><th>名称</th><th>代码</th><th>现价</th><th>涨跌</th><th>涨跌幅</th>' +
        '<th>时间</th><th></th></tr></thead><tbody></tbody>';
      const tbody = table.querySelector('tbody');
      g.codes.forEach((code, idx) => {
        const d = dataMap[code];
        const pos = posOf(code); // 该品种是否持有（在「我的」里）
        const tr = document.createElement('tr');
        if (pos) tr.className = 'has-pos';
        if (!d) {
          tr.innerHTML = `<td class="flat num">${idx + 1}</td>` + nameCell(d, code, pos) +
            `<td class="code">${fmtCode(code)}</td><td colspan="4" class="flat">无数据</td><td><button class="op del" title="删除">×</button></td>`;
          tr.querySelector('.del').addEventListener('click', () => removeCode(code));
        } else {
          const price = Number(d.price), yest = Number(d.yestclose);
          const updown = yest && !isNaN(yest) ? price - yest : 0;
          const pct = yest && yest !== 0 ? (updown / yest) * 100 : 0;
          const cls = updown > 0 ? 'up' : updown < 0 ? 'down' : 'flat';
          const sign = updown > 0 ? '+' : '';
          const chartBtn = code.startsWith('nf_')
            ? '<button class="op chart" title="分时图">▦</button>' : '';
          const delBtn = '<button class="op del" title="删除">×</button>';
          tr.innerHTML =
            `<td class="flat num">${idx + 1}</td>` +
            nameCell(d, code, pos) +
            `<td class="code">${fmtCode(code)}</td>` +
            `<td class="${cls}">${fmtNum(price)}</td>` +
            `<td class="${cls}">${sign}${fmtNum(updown, 2)}</td>` +
            `<td class="${cls}">${sign}${fmtNum(pct, 2)}%</td>` +
            `<td class="flat">${fmtTime(d.time)}</td>` +
            `<td>${chartBtn}${delBtn}</td>`;
          tr.querySelector('.del').addEventListener('click', () => removeCode(code));
          if (code.startsWith('nf_')) {
            tr.querySelector('.name').addEventListener('click', () => showChart(code));
            tr.querySelector('.chart').addEventListener('click', () => showChart(code));
          }
        }
        tbody.appendChild(tr);
      });
      sec.appendChild(table);
      main.appendChild(sec);
    });
  }

  // ===== 我的持仓 =====
  let sortDesc = true; // 盈亏金额排序方向（默认降序：赚最多在前）

  // 期货合约乘数：每手价格变动 1 元/点对应的盈亏金额
  const MULTIPLIER = {
    'RB': 10, 'HC': 10, 'CU': 5, 'AL': 5, 'ZN': 5, 'PB': 5, 'NI': 1, 'SN': 1,
    'AU': 1000, 'AG': 15, 'I': 100, 'J': 100, 'JM': 60, 'ZC': 100,
    'M': 10, 'Y': 10, 'P': 10, 'A': 10, 'B': 10, 'C': 10, 'CS': 10,
    'RM': 10, 'OI': 10, 'SR': 10, 'CF': 5, 'CY': 5, 'AP': 10, 'CJ': 5, 'JD': 10,
    'MA': 10, 'TA': 5, 'EG': 10, 'PP': 5, 'V': 5, 'L': 5, 'UR': 20, 'SA': 20,
    'FG': 20, 'SP': 10, 'SH': 30, 'AO': 20, 'SC': 1000, 'FU': 10, 'BU': 10,
    'RU': 10, 'NR': 10, 'PG': 20, 'EB': 5,
    'IF': 300, 'IH': 300, 'IC': 200, 'IM': 200,
    'T': 10000, 'TF': 10000, 'TS': 20000, 'TL': 10000,
    'OIL': 1000, 'CL': 1000, 'GC': 100, 'SI': 5000, 'HG': 25000, 'HSI': 50, 'XAU': 100,
  };
  function productCode(code) {
    const m = String(code || '').replace(/^(nf_|hf_)/, '').toUpperCase().match(/^[A-Z]+/);
    return m ? m[0] : '';
  }
  function currencyOf(code) {
    if (String(code).startsWith('hf_')) return code === 'hf_HSI' ? 'HKD' : 'USD';
    return 'CNY';
  }
  function currencyLabel(c) { return c === 'CNY' ? '元' : c; }
  function multiplierOf(pos) {
    if (pos.multiplier != null && !isNaN(pos.multiplier)) return Number(pos.multiplier);
    return MULTIPLIER[productCode(pos.code)] || 1;
  }
  // 方向：long=做多 / short=做空。旧数据没有该字段时按做多处理
  function dirOf(p) { return (p && p.direction === 'short') ? 'short' : 'long'; }
  function dirLabel(dir) { return dir === 'short' ? '空' : '多'; }
  // 价差按方向取正负，保证「价差为正 = 这笔在赚」
  function diffOf(price, buy, dir) {
    if (isNaN(price) || isNaN(buy)) return NaN;
    const raw = price - buy;
    return dir === 'short' ? -raw : raw;
  }

  function renderPositions(dataMap) {
    const box = document.getElementById('positions');
    const list = (configPositions || []).filter((p) => p.code);
    const rows = list.map((p) => {
      const d = dataMap[p.code];
      const price = d ? Number(d.price) : NaN;
      const name = d ? d.name : fmtCode(p.code);
      const buy = Number(p.buyPrice);
      const lots = Number(p.lots) || 1;
      const mult = multiplierOf(p);
      const dir = dirOf(p);
      // 历史遗留非国内期货（hf_/hk/股票等）：乘数/价差无意义，只读展示不估盈亏
      const isNf = /^nf_/i.test(p.code);
      const diff = (!isNf || isNaN(price) || isNaN(buy)) ? NaN : diffOf(price, buy, dir);
      const pnl = isNaN(diff) ? NaN : diff * lots * mult;
      return { id: p.id, code: p.code, name, price, buy, lots, diff, pnl, dir, currency: currencyOf(p.code) };
    });
    const sorted = rows.slice().sort((a, b) => {
      const av = isNaN(a.pnl) ? -Infinity : a.pnl;
      const bv = isNaN(b.pnl) ? -Infinity : b.pnl;
      return sortDesc ? bv - av : av - bv;
    });

    const totals = {};
    sorted.forEach((r) => { if (!isNaN(r.pnl)) totals[r.currency] = (totals[r.currency] || 0) + r.pnl; });
    const cNames = { CNY: '人民币', USD: '美元', HKD: '港币' };

    let html = '<section><div class="pos-head"><h2>我的持仓</h2>' +
      '<div style="display:flex;gap:6px;">' +
      '<button class="sort-btn" id="historyBtn">结算记录</button>' +
      '<button class="sort-btn" id="sortBtn">盈亏' + (sortDesc ? ' ↓' : ' ↑') + '</button>' +
      '<button class="sort-btn" id="addPosBtn">+ 新增</button></div></div>';
    html += '<table class="pos-table"><thead><tr><th class="num">#</th><th>名称</th><th>方向</th><th>现价</th><th>开仓价</th><th>价差</th><th>手数</th><th>盈亏</th><th></th></tr></thead><tbody>';
    if (!sorted.length) {
      html += '<tr><td colspan="9" class="flat">暂无持仓，点右上角「+ 新增」添加</td></tr>';
    } else {
      sorted.forEach((r, idx) => {
        const cls = !isNaN(r.pnl) ? (r.pnl > 0 ? 'up' : r.pnl < 0 ? 'down' : 'flat') : 'flat';
        const sign = !isNaN(r.diff) && r.diff > 0 ? '+' : '';
        // 仅国内期货可编辑/结算/查历史位置；历史遗留（hf_/hk/股票等）只读，保留删除
        const isNf = /^nf_/i.test(r.code);
        const opPos = /^nf_[A-Z]+\d{4}$/i.test(r.code) ? '<button class="op pos" title="历史价格位置（历年同月合约）">位</button>' : '';
        const opEdit = isNf ? '<button class="op edit" title="修改">✎</button>' : '';
        const opSettle = isNf ? '<button class="op settle" title="结算平仓">≡</button>' : '';
        const legacyTip = isNf ? '' : '（历史遗留记录：持仓/结算仅支持国内期货，此条可删除）';
        html += `<tr data-id="${r.id}"><td class="flat num">${idx + 1}</td><td class="name" title="${r.code}${legacyTip}">${r.name}</td>` +
          `<td class="${r.dir === 'short' ? 'down' : 'up'}">${dirLabel(r.dir)}</td>` +
          `<td>${isNaN(r.price) ? '--' : fmtNum(r.price)}</td>` +
          `<td>${fmtNum(r.buy)}</td>` +
          `<td class="${cls}">${isNaN(r.diff) ? '--' : sign + fmtNum(r.diff, 2)}</td>` +
          `<td>${r.lots}</td>` +
          `<td class="${cls}">${isNaN(r.pnl) ? '--' : (r.pnl > 0 ? '+' : '') + fmtNum(r.pnl, 0)} ${currencyLabel(r.currency)}</td>` +
          `<td>${opPos}${opEdit}${opSettle}<button class="op del" title="删除">×</button></td></tr>`;
      });
    }
    html += '</tbody></table>';
    Object.keys(totals).forEach((c) => {
      const v = totals[c];
      const cls = v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
      html += `<div class="pos-total ${cls}">${cNames[c] || c}合计：${v > 0 ? '+' : ''}${fmtNum(v, 0)} ${currencyLabel(c)}</div>`;
    });
    html += '</section>';
    box.innerHTML = html;
    const btn = box.querySelector('#sortBtn');
    if (btn) btn.addEventListener('click', () => { sortDesc = !sortDesc; renderPositions(lastDataMap); });
    const histBtn = box.querySelector('#historyBtn');
    if (histBtn) histBtn.addEventListener('click', openHistory);
    const addBtn2 = box.querySelector('#addPosBtn');
    if (addBtn2) addBtn2.addEventListener('click', () => openPosForm(null));
    box.querySelectorAll('.edit').forEach((b) => b.addEventListener('click', () => {
      const id = Number(b.closest('tr').dataset.id);
      const p = configPositions.find((x) => x.id === id);
      if (p) openPosForm(p);
    }));
    box.querySelectorAll('.settle').forEach((b) => b.addEventListener('click', () => {
      openSettleForm(Number(b.closest('tr').dataset.id));
    }));
    box.querySelectorAll('.del').forEach((b) => b.addEventListener('click', () => {
      deletePos(Number(b.closest('tr').dataset.id));
    }));
    box.querySelectorAll('.pos').forEach((b) => b.addEventListener('click', () => {
      const id = Number(b.closest('tr').dataset.id);
      const p = configPositions.find((x) => x.id === id);
      if (!p) return;
      const qd = lastDataMap[p.code];
      const price = qd ? Number(qd.price) : NaN;
      showHistPos(p.code, price);
    }));
  }

  }
  function authHeaders(extra) {
    const h = Object.assign({}, extra || {});

  async function savePos() {
    const code = normalizePosCode(posCode.value);
    const buyRaw = posBuy.value.trim();
    const lotsRaw = posLots.value.trim();
    const multRaw = posMult.value.trim();
    if (!code) { posMsg.textContent = '请输入国内期货合约代码（如 RB2701 / nf_RB2701），或从联想列表选择'; return; }
    // 国内期货：提交前调 validate 校验「交割月 >= 当前月」是否可交易（不再查表/is_active）
    if (code.startsWith('nf_')) {
      try {
        const vr = await fetch('/api/futures-base/validate', {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ codes: [code] }),
        });
        if (vr.status === 401) { toLogin(); return; }
        if (!vr.ok) { posMsg.textContent = '校验合约失败 HTTP ' + vr.status; return; }
        const vj = await vr.json();
        const r = (vj.results || []).find((x) => x.code === code);
        if (!r || !r.ok) { posMsg.textContent = (r && r.reason) || '合约不在可交易清单中（可能已到期下架或不存在）'; return; }
      } catch (e) {
        posMsg.textContent = '校验合约失败：' + e.message;
        return;
      }
    }
    const buy = Number(buyRaw);
    if (buyRaw === '' || isNaN(buy)) { posMsg.textContent = '请输入买入价'; return; }
    const lots = Number(lotsRaw);
    const payload = {
      code,
      direction: posDir.value,
      buy_price: buy,
      lots: (lotsRaw === '' || isNaN(lots) || lots <= 0) ? 1 : lots,
    };
    if (multRaw !== '') {
      const m = Number(multRaw);
      if (isNaN(m)) { posMsg.textContent = '乘数必须是数字'; return; }
      payload.multiplier = m;
    } else {
      payload.multiplier = null; // 留空则清除，恢复自动查乘数
    }
    try {
      const url = editingPosId ? '/api/positions/' + editingPosId : '/api/positions';
      const resp = await fetch(url, {
        method: editingPosId ? 'PUT' : 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(payload),
      });
      if (resp.status === 401) { toLogin(); return; }
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        posMsg.textContent = err.detail || ('HTTP ' + resp.status);
        return;
      }
      closePosForm();
      loadPositions();
    } catch (e) {
      posMsg.textContent = '保存失败：' + e.message;
    }
  }

    settlePrice.value = isNaN(curPrice) ? '' : curPrice;

  function closeSettleForm() { settleMask.classList.remove('show'); settlingPosId = null; settleLots.value = ''; }
  async function settlePos() {
    const raw = settlePrice.value.trim();
    const price = Number(raw);
    if (raw === '' || isNaN(price)) { settleMsg.textContent = '请输入结算价'; return; }
    if (!settlingPosId) { settleMsg.textContent = '未选择持仓'; return; }
    const p = configPositions.find((x) => x.id === settlingPosId);
    if (!p) { settleMsg.textContent = '持仓不存在'; return; }
    const d = lastDataMap[p.code];
    const name = d ? d.name : null;
    // 手数：留空 / 空字符串 = 全部平仓；否则按用户输入校验
    const lotsRaw = settleLots.value.trim();
    let lots = null;
    if (lotsRaw !== '') {
      lots = Number(lotsRaw);
      const total = Number(p.lots) || 0;
      if (!Number.isFinite(lots) || lots <= 0) { settleMsg.textContent = '手数必须为正数'; return; }
      if (lots > total + 1e-9) { settleMsg.textContent = '手数不能超过持仓手数 ' + total; return; }
    }
    const payload = {
      settle_price: price,
      direction: dirOf(p),
      name,
      currency: currencyOf(p.code),
      multiplier: multiplierOf(p),
    };
    if (lots !== null) payload.lots = lots;
    try {
      const resp = await fetch('/api/positions/' + settlingPosId + '/settle', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(payload),
      });
      if (resp.status === 401) { toLogin(); return; }
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        settleMsg.textContent = err.detail || ('HTTP ' + resp.status);
        return;
      }
      closeSettleForm();
      loadPositions();
    } catch (e) {
      settleMsg.textContent = '结算失败：' + e.message;
    }
  }

  async function loadMinLine(code) {
    const symbol = code.replace(/^nf_/, '');
    chartSub.textContent = '';
    try {
      const resp = await fetch('/api/futures/minline?symbol=' + encodeURIComponent(symbol));
      const json = await resp.json();
      const data = json.data;
      if (!Array.isArray(data) || data.length === 0) { chartSub.textContent = '无分时数据'; return; }
      const yestclose = data.length && data[0].length > 5 ? Number(data[0][5]) : 0;
      drawMinLine(chartCanvas, data, yestclose);
      chartSub.textContent = symbol + (yestclose ? ' · 昨结 ' + fmtNum(yestclose) : '');
    } catch (e) {

  async function loadDailyKLine(code) {
    const symbol = code.replace(/^nf_/, '');
    chartSub.textContent = '';
    try {
      const resp = await fetch('/api/futures/dailykline?symbol=' + encodeURIComponent(symbol));
      const json = await resp.json();
      const data = json.data;

      drawDailyKLine(chartCanvas, data, symbol);
    } catch (e) {
      chartSub.textContent = '加载失败';
    }
  }
  function drawMinLine(canvas, data, yestclose) {
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    const n = data.length;
    if (!n) return;
    const padL = 56, padR = 16, padT = 18, padB = 22;
    const volH = 76, gap = 22;
    const priceH = H - padT - padB - volH - gap;
    const plotW = W - padL - padR;

    const prices = data.map((r) => Number(r[1]));
    const avgs = data.map((r) => Number(r[2]));
    const vols = data.map((r) => Number(r[3] || 0));
    let minP = Math.min(...prices, yestclose || Infinity);
    let maxP = Math.max(...prices, yestclose || -Infinity);
    avgs.forEach((v) => { if (v > 0) { minP = Math.min(minP, v); maxP = Math.max(maxP, v); } });
    const pad = (maxP - minP) * 0.08 || 1;
    minP -= pad; maxP += pad;
    const maxVol = Math.max(...vols, 1);

    const x = (i) => padL + (n === 1 ? 0 : (i / (n - 1)) * plotW);
    const yP = (v) => padT + ((maxP - v) / (maxP - minP)) * priceH;
    const volTop = padT + priceH + gap;
    const yV = (v) => volTop + volH - (v / maxVol) * volH;

    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.font = '10px monospace';
    const gridN = 4;
    for (let i = 0; i <= gridN; i++) {
      const v = minP + ((maxP - minP) / gridN) * i;
      const y = yP(v);
      ctx.strokeStyle = cssVar('--grid'); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
      ctx.fillStyle = cssVar('--muted');
      ctx.fillText(v.toFixed(1), padL - 4, y);
    }
    if (yestclose) {
      ctx.strokeStyle = cssVar('--muted'); ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(padL, yP(yestclose)); ctx.lineTo(W - padR, yP(yestclose)); ctx.stroke();
      ctx.setLineDash([]);
    }
    for (let i = 0; i < n; i++) {
      const prev = i > 0 ? prices[i - 1] : yestclose;
      ctx.fillStyle = prices[i] >= prev ? 'rgba(255,92,92,0.55)' : 'rgba(46,194,126,0.55)';
      const bw = Math.max(1, plotW / n - 0.5);
      ctx.fillRect(x(i) - bw / 2, yV(vols[i]), bw, volTop + volH - yV(vols[i]));
    }
    const last = prices[n - 1];
    const lineColor = last >= yestclose ? '#ff5c5c' : '#2ec27e';
    drawLine(ctx, data.map((r, i) => [x(i), yP(Number(r[1]))]), lineColor, 1.5);
    drawLine(ctx, data.map((r, i) => [x(i), Number(r[2]) > 0 ? yP(Number(r[2])) : null]).filter((p) => p[1] !== null), '#f0b90b', 1);

    ctx.fillStyle = cssVar('--muted');
    ctx.textAlign = 'center';
    const times = data.map((r) => r[0]);
    [0, Math.floor(n / 4), Math.floor(n / 2), Math.floor((3 * n) / 4), n - 1].forEach((i) => {
      if (times[i]) ctx.fillText(times[i], x(i), H - 8);
    });
    ctx.textAlign = 'left';
    ctx.fillStyle = lineColor; ctx.fillText('价格', padL + 4, padT - 4);
    ctx.fillStyle = '#f0b90b'; ctx.fillText('均价', padL + 48, padT - 4);
  }
  function drawLine(ctx, pts, color, w) {
    if (!pts.length) return;
    ctx.strokeStyle = color; ctx.lineWidth = w;
    ctx.beginPath();
    pts.forEach((p, i) => (i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1])));
    ctx.stroke();
  }
  function drawDailyKLine(canvas, data, symbol) {
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    const N = 120;
    const rows = data.slice(-N);
    const n = rows.length;
    if (!n) return;
    const padL = 56, padR = 16, padT = 18, padB = 22;
    const volH = 76, gap = 22;
    const priceH = H - padT - padB - volH - gap;
    const plotW = W - padL - padR;

    const opens = rows.map((r) => +r.o), closes = rows.map((r) => +r.c);
    const highs = rows.map((r) => +r.h), lows = rows.map((r) => +r.l);
    const vols = rows.map((r) => +r.v);
    const minP = Math.min(...lows), maxP = Math.max(...highs);
    const pad = (maxP - minP) * 0.05 || 1;
    const lo = minP - pad, hi = maxP + pad;
    const maxVol = Math.max(...vols, 1);

    const yP = (v) => padT + ((hi - v) / (hi - lo)) * priceH;
    const volTop = padT + priceH + gap;
    const yV = (v) => volTop + volH - (v / maxVol) * volH;

    ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.font = '10px monospace';
    const gridN = 4;
    for (let i = 0; i <= gridN; i++) {
      const v = lo + ((hi - lo) / gridN) * i;
      const y = yP(v);
      ctx.strokeStyle = cssVar('--grid'); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
      ctx.fillStyle = cssVar('--muted'); ctx.fillText(v.toFixed(1), padL - 4, y);
    }

    const cw = plotW / n;
    const bw = Math.max(1, cw * 0.7);
    for (let i = 0; i < n; i++) {
      const cx = padL + i * cw + cw / 2;
      const up = closes[i] >= opens[i];
      const color = up ? '#ff5c5c' : '#2ec27e';
      ctx.fillStyle = up ? 'rgba(255,92,92,0.5)' : 'rgba(46,194,126,0.5)';
      ctx.fillRect(cx - bw / 2, yV(vols[i]), bw, volTop + volH - yV(vols[i]));
      ctx.strokeStyle = color; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx, yP(highs[i])); ctx.lineTo(cx, yP(lows[i])); ctx.stroke();
      const yo = yP(opens[i]), yc = yP(closes[i]);
      ctx.fillStyle = color;
      ctx.fillRect(cx - bw / 2, Math.min(yo, yc), bw, Math.max(1, Math.abs(yo - yc)));
    }

    ctx.fillStyle = cssVar('--muted'); ctx.textAlign = 'center';
    const dates = rows.map((r) => r.d);
    [0, Math.floor(n / 4), Math.floor(n / 2), Math.floor((3 * n) / 4), n - 1].forEach((i) => {
      const cx = padL + i * cw + cw / 2;
      if (dates[i]) ctx.fillText(dates[i].slice(5), cx, H - 8);
    });
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ff5c5c'; ctx.fillText('阳线', padL + 4, padT - 4);
    ctx.fillStyle = '#2ec27e'; ctx.fillText('阴线', padL + 48, padT - 4);
    chartSub.textContent = symbol + ' · 最近 ' + n + ' 根日K';
  }
  function closeChart() { chartMask.classList.remove('show'); }

  // ===== 历史价格位置：当前价在历年同月合约合并区间里的位置 =====
  function hpCss() {
    if (document.getElementById('hpStyle')) return;
    const st = document.createElement('style');
    st.id = 'hpStyle';
    st.textContent = [
      '.hp-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;display:flex;align-items:center;justify-content:center;}',
      '.hp-panel{background:var(--panel,#151515);color:var(--fg,#e6edf3);border:1px solid var(--line,#2a2a2a);border-radius:12px;padding:18px 22px;width:min(600px,92vw);max-height:82vh;overflow:auto;position:relative;font-size:13px;box-shadow:0 8px 40px rgba(0,0,0,.5);}',
      '.hp-close{position:absolute;right:12px;top:6px;cursor:pointer;font-size:20px;color:var(--muted,#8b949e);line-height:1;}',
      '.hp-panel h3{margin:0 0 10px;font-size:15px;}',
      '.hp-sub{color:var(--muted,#8b949e);margin:4px 0 12px;}',
      '.hp-big{font-size:26px;font-weight:700;margin-bottom:2px;}',
      '.hp-scale{position:relative;height:10px;border-radius:5px;margin:12px 0 2px;background:linear-gradient(90deg,#2ec27e,#eac54f,#ff5c5c);}',
      '.hp-marker{position:absolute;top:-4px;width:3px;height:18px;background:#fff;border-radius:2px;transform:translateX(-50%);box-shadow:0 0 6px rgba(0,0,0,.8);}',
      '.hp-axis{display:flex;justify-content:space-between;color:var(--muted,#8b949e);font-size:11px;margin-bottom:8px;}',
      '.hp-years{margin-top:10px;border-top:1px solid var(--line,#2a2a2a);padding-top:8px;color:var(--muted,#8b949e);line-height:1.9;}',
      '.hp-years b{color:var(--fg,#e6edf3);}',
      '.hp-err{color:#ff5c5c;margin-top:8px;}'
    ].join('\n');
    document.head.appendChild(st);
  }
  function hpEsc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  async function showHistPos(code, price) {
    hpCss();
    const overlay = document.createElement('div');
    overlay.className = 'hp-ov';
    const panel = document.createElement('div');
    panel.className = 'hp-panel';
    panel.innerHTML = '<span class="hp-close">×</span><h3>历史价格位置</h3><div class="hp-sub">计算中…</div>';
    overlay.appendChild(panel);
    document.body.appendChild(overlay);
    const close = () => overlay.remove();
    panel.querySelector('.hp-close').addEventListener('click', close);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    const url = '/api/futures/hist-position?code=' + encodeURIComponent(code) +
      (Number.isFinite(price) ? '&price=' + encodeURIComponent(String(price)) : '');
    try {
      const resp = await fetch(url);
      const j = await resp.json();
      const f = (v, d) => { const n = Number(v); return Number.isFinite(n) ? (d === undefined ? fmtNum(n) : fmtNum(n, d)) : '--'; };
      if (!j.ok) {
        panel.innerHTML = '<span class="hp-close">×</span><h3>历史价格位置 · ' + hpEsc(j.code || code) + '</h3><div class="hp-err">' + hpEsc(j.reason || '暂无数据') + '</div>';
        panel.querySelector('.hp-close').addEventListener('click', close);
        return;
      }
      const s = j.stats;
      const years = (j.per_year || []).map((y) => `<div><b>${hpEsc(y.symbol)}</b>　${y.days}天　${f(y.min)} ~ ${f(y.max)}</div>`).join('');
      const skip = (j.skipped_years && j.skipped_years.length) ? '<div class="hp-years">未纳入（新浪无更早数据）：' + hpEsc(j.skipped_years.join('、')) + '</div>' : '';
      const span = (s.max - s.min) > 0 ? Math.max(0, Math.min(100, (j.price - s.min) / (s.max - s.min) * 100)) : 50;
      panel.innerHTML =
        '<span class="hp-close">×</span>' +
        '<h3>历史价格位置 · ' + hpEsc(j.code) + '</h3>' +
        '<div class="hp-sub">交割月 ' + hpEsc(j.delivery_month) + ' · 现价 <b>' + f(j.price) + '</b> · 对比历年同月合约 <b>' + s.days + '</b> 个交易日</div>' +
        '<div class="hp-big">' + s.pct + '%</div>' +
        '<div class="hp-sub">高于同月历史合约 ' + s.pct + '% 的交易日（越接近 100% 越处于历史高位）</div>' +
        '<div class="hp-scale"><div class="hp-marker" style="left:' + span + '%"></div></div>' +
        '<div class="hp-axis"><span>' + f(s.min) + '</span><span>中位 ' + f(s.median) + '</span><span>' + f(s.max) + '</span></div>' +
        '<div class="hp-years">历年同月合约区间：<br>' + years + '</div>' + skip;
      panel.querySelector('.hp-close').addEventListener('click', close);
    } catch (e) {
      panel.innerHTML = '<span class="hp-close">×</span><h3>历史价格位置</h3><div class="hp-err">加载失败：' + hpEsc(String(e)) + '</div>';
      panel.querySelector('.hp-close').addEventListener('click', close);
    }
  }
  chartClose.addEventListener('click', closeChart);
  chartMask.addEventListener('click', (e) => { if (e.target === chartMask) closeChart(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeChart(); });
  tabBtns.forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));

  // ===== 搜索联想 =====
  let suggestTimer = null;
  function hideSuggest() { suggestBox.classList.remove('show'); }
  searchInput.addEventListener('input', () => {
    clearTimeout(suggestTimer);
    const kw = searchInput.value.trim();
    if (!kw) { hideSuggest(); return; }
    suggestTimer = setTimeout(() => searchSuggest(kw), 300);
  });
  async function searchSuggest(kw) {
    try {
      const resp = await fetch('/api/futures/suggest?key=' + encodeURIComponent(kw));
      const json = await resp.json();
      const items = json.items || [];
      renderSuggest(items);
    } catch (e) { hideSuggest(); }
  }
  function renderSuggest(items) {
    if (!items.length) { hideSuggest(); return; }
    suggestBox.innerHTML = '';
    items.forEach((it) => {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML =
        `<span class="nm">${it.name}</span><span class="cd">${fmtCode(it.code)}</span><span class="mk">${it.market}</span>`;
      div.addEventListener('click', () => {
        hideSuggest();
        searchInput.value = '';
        openAddForm(it.code, it.name);
      });
      suggestBox.appendChild(div);
    });
    suggestBox.classList.add('show');
  }
  document.addEventListener('click', (e) => {
    if (!suggestBox.contains(e.target) && e.target !== searchInput) hideSuggest();
  });

  // ===== 行情加载 =====
  async function load() {
    const codes = allCodes();
    if (!codes.length) { render({}); updateTime.textContent = '无数据'; return; }
    try {
      const resp = await fetch('/api/futures?codes=' + encodeURIComponent(codes.join(',')));
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const json = await resp.json();
      const list = json.items || [];
      const map = {};
      list.forEach((it) => { map[it.code] = it; });
      render(map);
      renderPositions(map);
      banner.style.display = 'none';
      updateTime.textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
    } catch (e) {
      banner.style.display = 'block';
      updateTime.textContent = '连接失败';
    }
  }
  function setupTimer() {
    if (timer) { clearInterval(timer); timer = null; }
    const ms = Number(intervalSel.value);
    dot.className = ms === 0 ? 'dot off' : 'dot';
    if (ms > 0) timer = setInterval(load, ms);
  }

  refreshBtn.addEventListener('click', load);
  intervalSel.addEventListener('change', setupTimer);
  addBtn.addEventListener('click', () => {
    const kw = searchInput.value;
    searchInput.value = '';
    hideSuggest();
    openAddForm(kw);
  });
  searchInput.addEventListener('keydown', (e) => {
    // 中文输入法候选词回车确认（isComposing / keyCode 229）不当作搜索回车
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter') {
      const first = suggestBox.querySelector('.item');
      // 联想列表已展开时点第一项（内部会关闭联想并打开确认弹窗）
      if (suggestBox.classList.contains('show') && first) { first.click(); return; }
      const kw = searchInput.value;
      searchInput.value = '';
      hideSuggest();
      openAddForm(kw);
    }
  });

  // ===== 配置文件实时同步 =====
  async function loadConfig(force) {
    try {
      const resp = await fetch('/api/groups?t=' + Date.now(), { headers: authHeaders() });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const gs = await resp.json();
      const sig = JSON.stringify(gs);
      if (force || sig !== configSig) {
        configSig = sig;
        configGroups = (Array.isArray(gs) ? gs : []).map((g) => ({
              id: Number(g.id),
              name: String(g.name || '未命名'),
              codes: (Array.isArray(g.codes) ? g.codes : []).map(normalizeCode).filter(Boolean),
            }));
        load();
      }
    } catch (e) {
      // 拉取失败时沿用默认分组
    }
  }
  async function loadPositions() {
    // 持仓来自数据库 /api/positions，不再读 config.json
    try {
      const resp = await fetch('/api/positions', { headers: authHeaders() });
      // 未登录不跳转：静默按无持仓处理，先展示看板默认品种
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const ps = await resp.json();
      configPositions = ps.map((p) => ({
        id: p.id,
        // 历史遗留的 hf_/hk 等已下线代码保留原样（只读展示，供删除）；其余统一规范化
        code: normalizeCode(p.code) || String(p.code || '').toLowerCase(),
        direction: p.direction || 'long',
        buyPrice: Number(p.buy_price),
        lots: Number(p.lots) || 1,
        multiplier: p.multiplier != null ? Number(p.multiplier) : undefined,
      })).filter((p) => p.code);
    } catch (e) {
      configPositions = [];
    }
    load();
  }

  setupTimer();
  initNav();
  bindLogout();
  loadPositions();
  loadConfig(true);
  setInterval(() => loadConfig(false), CONFIG_POLL_MS);
})();
</script>
<script src="/modules/lib/terminal.js"></script>
